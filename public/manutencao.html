<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a3f5e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Minha Equipe | Zelacity Plataforma</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/assets/app-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/assets/app-icon.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="mobile-maintenance-page">
    <header class="mobile-header"><a class="brand brand-light" href="/"><span class="brand-logo-frame"><img class="brand-logo" src="/assets/zelacity-logo.jpg" alt="" /></span><span class="brand-name">Zelacity <span>Plataforma</span></span></a><button id="logout-button" class="mobile-logout" type="button">Sair</button></header>
    <main class="mobile-maintenance-main"><div class="mobile-intro"><p class="eyebrow">Área da equipe</p><h1>Meus serviços<br /><em>em campo.</em></h1><p id="team-label">Carregando ordens atribuídas...</p></div><div id="mobile-orders" class="mobile-orders"></div></main>

    <section class="mobile-finish-sheet" id="service-sheet" hidden aria-label="Detalhes do serviço"><div class="sheet-backdrop" data-close-sheet="service"></div><div class="sheet-content service-sheet-content"><div class="sheet-handle"></div><div class="sheet-heading"><div><p class="eyebrow">Detalhes do serviço</p><h2 id="service-order-number">OS-2026-00001</h2></div><button class="dialog-close" data-close-sheet="service" type="button" aria-label="Fechar">×</button></div><div id="service-details" class="service-details"></div><div id="service-images" class="service-images"></div><div id="service-history" class="service-history"></div><div class="service-actions" id="service-actions"></div></div></section>

    <section class="mobile-finish-sheet" id="finish-sheet" hidden aria-label="Concluir serviço"><div class="sheet-backdrop" data-close-sheet="finish"></div><div class="sheet-content"><div class="sheet-handle"></div><div class="sheet-heading"><div><p class="eyebrow">Serviço concluído</p><h2 id="finish-order-number">OS-2026-00001</h2></div><button class="dialog-close" data-close-sheet="finish" type="button" aria-label="Fechar">×</button></div><form id="finish-form" class="finish-form"><label class="field">Observação da execução *<textarea name="observation" rows="4" placeholder="Descreva o serviço realizado." required></textarea></label><label class="field">Data e horário da execução *<input name="executedAt" id="executed-at" type="datetime-local" required /></label><div class="location-capture mobile-location"><div><strong>Minha localização <small>opcional</small></strong><p>Registre o ponto onde o serviço foi executado.</p></div><button class="button button-secondary button-small" id="execution-location-button" type="button">Usar localização atual</button><p class="location-feedback" id="execution-location-feedback" aria-live="polite"></p><input name="latitude" id="execution-latitude" type="hidden" /><input name="longitude" id="execution-longitude" type="hidden" /></div><label class="photo-field">Foto antes<input name="beforePhoto" type="file" accept="image/jpeg,image/png,image/webp" capture="environment" /><span>Adicionar foto antes <small>JPG, PNG ou WebP · até 5 MB</small></span></label><label class="photo-field">Foto depois<input name="afterPhoto" type="file" accept="image/jpeg,image/png,image/webp" capture="environment" /><span>Adicionar foto depois <small>JPG, PNG ou WebP · até 5 MB</small></span></label><p class="form-error" id="finish-error" role="alert" hidden></p><button class="button button-primary" type="submit">Serviço concluído <span aria-hidden="true">✓</span></button></form></div></section>

    <section class="mobile-finish-sheet" id="pending-sheet" hidden aria-label="Registrar pendência"><div class="sheet-backdrop" data-close-sheet="pending"></div><div class="sheet-content"><div class="sheet-handle"></div><div class="sheet-heading"><div><p class="eyebrow">Não foi possível concluir</p><h2 id="pending-order-number">OS-2026-00001</h2></div><button class="dialog-close" data-close-sheet="pending" type="button" aria-label="Fechar">×</button></div><form id="pending-form" class="finish-form"><label class="field">Motivo *<select name="reason" id="pending-reason" required><option value="">Selecione</option><option value="FALTA_MATERIAL">Falta de material</option><option value="NECESSIDADE_EQUIPAMENTO">Necessidade de máquina/equipamento</option><option value="LOCAL_NAO_ENCONTRADO">Endereço/local não encontrado</option><option value="PROBLEMA_DIFERENTE">Problema diferente do informado</option><option value="VISTORIA_TECNICA">Necessidade de vistoria técnica</option><option value="CONDICOES_CLIMATICAS">Condições climáticas</option><option value="AREA_INACESSIVEL">Área inacessível</option><option value="OUTRA_EQUIPE">Serviço depende de outra equipe</option><option value="OUTRO">Outro</option></select></label><label class="field" id="pending-observation-field">Observação <small id="pending-observation-help">opcional</small><textarea name="observation" id="pending-observation" rows="4" placeholder="Descreva a situação encontrada."></textarea></label><p class="form-error" id="pending-error" role="alert" hidden></p><button class="button button-secondary" type="submit">Enviar para avaliação</button></form></div></section>
    <script src="/manutencao.js"></script>
    <script src="/pwa.js"></script>
  </body>
</html>
