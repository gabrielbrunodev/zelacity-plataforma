<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" /><meta name="theme-color" content="#0c4a6e" /><title>Gabinete | Zelacity</title><link rel="stylesheet" href="/styles.css" /></head><body class="dashboard-page"><header class="site-header"><nav class="nav container"><a class="brand" href="/"><span class="brand-name">Zelacity <span>Plataforma</span></span></a><div class="nav-actions"><span class="user-chip" id="user"></span><button class="nav-logout" id="logout" type="button">Sair</button></div></nav></header><main class="dashboard container"><div class="dashboard-heading"><div><p class="eyebrow">Área do vereador</p><h1 id="greeting">Meu gabinete</h1></div><p>Registre demandas recebidas da população e acompanhe somente os protocolos cadastrados por você.</p></div><div class="metrics-grid" id="metrics"></div><section class="dashboard-section"><h2>Nova solicitação</h2><form id="request-form" class="user-form"><label class="field">Solicitante <small>opcional</small><input name="name" autocomplete="name" autocapitalize="words" /></label><label class="field">Telefone <small>opcional</small><input name="phone" type="tel" inputmode="tel" autocomplete="tel" /></label><label class="field">Categoria *<select name="serviceType" id="category" required></select></label><label class="field">Endereço *<input name="location" autocomplete="street-address" autocapitalize="words" required /></label><label class="field">Bairro *<input name="neighborhood" autocomplete="address-level2" autocapitalize="words" required /></label><label class="field">Referência <small>opcional</small><input name="reference" autocapitalize="sentences" /></label><label class="field field-wide">Descrição *<textarea name="description" rows="4" autocapitalize="sentences" required></textarea></label><label class="field">Foto <small>opcional</small><input name="requestPhoto" type="file" accept="image/jpeg,image/png,image/webp" capture="environment" /></label><div class="location-capture"><div><strong>Localização <small>opcional</small></strong><p id="location-feedback">Compartilhe apenas se desejar registrar o ponto exato.</p></div><button class="button button-secondary button-small" id="location-button" type="button">Usar localização atual</button><input name="latitude" type="hidden" /><input name="longitude" type="hidden" /></div><button class="button button-primary button-small" type="submit">Registrar solicitação</button><p class="inline-feedback" id="feedback"></p></form></section><section class="dashboard-section"><h2>Minhas solicitações</h2><div id="requests"></div></section></main><script src="/runtime-config.js"></script><script src="/capacitor-adapter.js"></script><script src="/vereador.js"></script></body></html>
